name: Build ExtendedHorizons

on:
  push:
    branches: [ "v3" ]
  release:
    types: [ "published" ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ExtendedHorizons
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Checkout Winter Framework (Core/Paper)
        uses: actions/checkout@v4
        with:
          repository: thewinterframework/winter
          path: deps/winter
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Publish Winter Framework to MavenLocal
        run: |
          cd deps/winter
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Checkout Winter Configuration
        uses: actions/checkout@v4
        with:
          repository: Mapacheee/configuration
          path: deps/configuration
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Publish Winter Configuration to MavenLocal
        run: |
          cd deps/configuration
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Checkout Winter Command
        uses: actions/checkout@v4
        with:
          repository: thewinterframework/command
          path: deps/command
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Publish Winter Command to MavenLocal
        run: |
          cd deps/command
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Checkout MapacheeeLib
        uses: actions/checkout@v4
        with:
          repository: Mapacheee/MapacheeeLib
          path: deps/mapacheeelib
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Publish MapacheeeLib to MavenLocal
        run: |
          cd deps/mapacheeelib
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew shadowJar --no-daemon

      - name: Prepare release metadata
        id: release_meta
        if: github.event_name == 'push'
        run: |
          short_sha="${GITHUB_SHA::7}"
          {
            echo "short_sha=${short_sha}"
            echo "tag_name=v3-dev-${GITHUB_SHA}"
            echo "release_name=ExtendedHorizons v3 dev ${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtendedHorizons-v3-${{ github.sha }}
          path: build/libs/ExtendedHorizons-*.jar
          retention-days: 7 
          if-no-files-found: error

      - name: Create prerelease with artifacts
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          fail_on_unmatched_files: true
          files: build/libs/ExtendedHorizons-*.jar

      - name: Add artifacts to published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: build/libs/ExtendedHorizons-*.jar
